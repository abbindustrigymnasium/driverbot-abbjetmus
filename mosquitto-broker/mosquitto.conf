# MQTT-broker för Hitachigymnasiet (Driverbot, ROS2-labbar, temperaturprojekt)
# Deployad på CapRover som appen "mqtt-broker" -> mqtt-broker.cloud.mustini.com

# Vanlig MQTT (ESP8266-firmware, mosquitto_pub/sub, ROS2-bryggan)
listener 1883
protocol mqtt

# MQTT över WebSockets (elevernas webbsidor: ws://mqtt-broker.cloud.mustini.com:9001)
listener 9001
protocol websockets

# Ingen inloggning krävs. Klienter som ändå skickar användarnamn/lösenord accepteras.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
